
<div class="space-y-8">

  <!-- Page Header -->
  <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
    <div>
      <h2 class="text-2xl font-bold text-slate-800">Dashboard Overview</h2>
      <p class="text-slate-600 mt-1">Real-time system statistics</p>
    </div>
  </div>

  <!-- Stats Grid -->
  <div class="grid grid-cols-1 sm:grid-cols-2 xl:grid-cols-4 gap-6">

    <!-- Total Users -->
    <div class="bg-white rounded-xl border border-slate-200 p-6 hover:shadow-lg transition">
      <p class="text-sm font-medium text-slate-600 mb-1">Total Users</p>
      <p class="text-3xl font-bold text-slate-800 mb-2">{{ data?.totalUsers }}</p>
      <p class="text-xs text-emerald-600 font-medium">Active accounts</p>
    </div>

    <!-- Total Products -->
    <div class="bg-white rounded-xl border border-slate-200 p-6 hover:shadow-lg transition">
      <p class="text-sm font-medium text-slate-600 mb-1">Total Products</p>
      <p class="text-3xl font-bold text-slate-800 mb-2">{{ data?.totalProducts }}</p>
      <p class="text-xs text-emerald-600 font-medium">Products available</p>
    </div>

    <!-- Supply Logs -->
    <div class="bg-white rounded-xl border border-slate-200 p-6 hover:shadow-lg transition">
      <p class="text-sm font-medium text-slate-600 mb-1">Supply Logs</p>
      <p class="text-3xl font-bold text-slate-800 mb-2">{{ data?.totalLogs }}</p>
      <p class="text-xs text-emerald-600 font-medium">Blockchain entries</p>
    </div>

    <!-- Feedbacks -->
    <div class="bg-white rounded-xl border border-slate-200 p-6 hover:shadow-lg transition">
      <p class="text-sm font-medium text-slate-600 mb-1">Feedbacks</p>
      <p class="text-3xl font-bold text-slate-800 mb-2">{{ data?.totalFeedbacks }}</p>
      <p class="text-xs text-emerald-600 font-medium">User feedback received</p>
    </div>

  </div>

</div>
