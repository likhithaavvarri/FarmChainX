<nav
  class="fixed top-0 left-0 w-full z-50 transition-all duration-500
         backdrop-blur-xl border-b"
  [class.bg-white/80]="isScrolled"
  [class.bg-gradient-to-r]="!isScrolled"
  [class.from-emerald-500]="!isScrolled"
  [class.to-teal-600]="!isScrolled"
  [class.text-gray-700]="isScrolled"
  [class.text-white]="!isScrolled"
  [class.shadow-md]="isScrolled"
  [class.py-3]="isScrolled"
  [class.py-5]="!isScrolled"
>
  <div class="max-w-7xl mx-auto px-4 md:px-8 lg:px-12 flex items-center justify-between">

    <!-- LOGO -->
    <a routerLink="/" class="flex items-center gap-2">
      <div
        class="w-10 h-10 rounded-lg flex items-center justify-center text-xl font-bold transition-all duration-500"
        [class.bg-white]="isScrolled"
        [class.text-emerald-600]="isScrolled"
        [class.bg-emerald-600]="!isScrolled"
        [class.text-white]="!isScrolled"
      >
        🌾
      </div>

      <span
        class="hidden sm:block text-2xl font-bold transition-all duration-500"
        [class.text-emerald-700]="isScrolled"
        [class.text-white]="!isScrolled"
      >
        FarmChainX
      </span>
    </a>

    <!-- DESKTOP NAV -->
    <div class="hidden md:flex items-center gap-8">

      <!-- Desktop Links -->
      <ng-container *ngIf="isLoggedIn">

        <a routerLink="/scanner"
           class="relative group"
        >
          Scan QR
          <span
            class="absolute left-0 -bottom-1 h-0.5 w-0 bg-current group-hover:w-full transition-all duration-300"
          ></span>
        </a>

        <a *ngIf="isFarmer" routerLink="/upload" class="relative group">
          Upload
          <span class="absolute left-0 -bottom-1 h-0.5 w-0 bg-current group-hover:w-full transition-all duration-300"></span>
        </a>

        <a *ngIf="isFarmer" routerLink="/products/my" class="relative group">
          My Products
          <span class="absolute left-0 -bottom-1 h-0.5 w-0 bg-current group-hover:w-full transition-all duration-300"></span>
        </a>

        <a *ngIf="isAdmin" routerLink="/admin" class="relative group">
          Admin
          <span class="absolute left-0 -bottom-1 h-0.5 w-0 bg-current group-hover:w-full transition-all duration-300"></span>
        </a>
        
      </ng-container>

      <ng-container *ngIf="!isLoggedIn">
        <a routerLink="/login" class="relative group">
          Login
          <span class="absolute left-0 -bottom-1 h-0.5 w-0 bg-current group-hover:w-full transition-all duration-300"></span>
        </a>

        <a routerLink="/register"
           class="px-6 py-2 rounded-full font-semibold shadow-md transition-all duration-500"
           [class.bg-emerald-600]="!isScrolled"
           [class.text-white]="!isScrolled"
           [class.bg-emerald-700]="isScrolled"
           [class.text-white]="isScrolled"
        >
          Register
        </a>
      </ng-container>

      <!-- User Avatar -->
      <div *ngIf="isLoggedIn" class="relative">
        <button (click)="toggleUserMenu()" class="flex items-center gap-2">
          <div
            class="w-9 h-9 rounded-full flex items-center justify-center text-sm font-bold transition-all duration-500"
            [class.bg-white]="isScrolled"
            [class.text-emerald-600]="isScrolled"
            [class.bg-emerald-600]="!isScrolled"
            [class.text-white]="!isScrolled"
          >
            {{ userName?.charAt(0)?.toUpperCase() }}
          </div>
        </button>

        <!-- User Dropdown -->
        <div
          *ngIf="userMenuOpen"
          class="absolute right-0 mt-3 w-48 bg-white text-gray-800 shadow-xl rounded-lg border p-2"
        >
          <p class="px-4 py-2 text-sm">Signed in as <br><strong>{{ userName }}</strong></p>
          <button (click)="logout()"
                  class="text-left text-red-600 w-full px-4 py-2 hover:bg-red-50 rounded-lg">
            Logout
          </button>
        </div>
      </div>

    </div>

    <!-- MOBILE MENU BUTTON -->
    <svg *ngIf="!mobileMenuOpen"
         (click)="toggleMobileMenu()"
         class="h-7 w-7 md:hidden cursor-pointer transition-all"
         [class.text-gray-700]="isScrolled"
         [class.text-white]="!isScrolled"
         fill="none"
         stroke="currentColor"
         stroke-width="2"
         viewBox="0 0 24 24"
    >
      <line x1="4" y1="6" x2="20" y2="6"/>
      <line x1="4" y1="12" x2="20" y2="12"/>
      <line x1="4" y1="18" x2="20" y2="18"/>
    </svg>

    <svg *ngIf="mobileMenuOpen"
         (click)="toggleMobileMenu()"
         class="h-7 w-7 md:hidden cursor-pointer text-gray-700"
         fill="none"
         stroke="currentColor"
         stroke-width="2"
         viewBox="0 0 24 24"
    >
      <line x1="6" y1="6" x2="18" y2="18"/>
      <line x1="6" y1="18" x2="18" y2="6"/>
    </svg>

  </div>

  <!-- MOBILE MENU OVERLAY -->
  <div
    *ngIf="mobileMenuOpen"
    class="fixed top-0 left-0 w-full h-screen bg-white text-gray-800 flex flex-col items-center justify-center gap-8 text-xl z-40"
  >
    <a routerLink="/scanner" (click)="closeMobileMenu()">Scan QR</a>
    <a *ngIf="isFarmer" routerLink="/upload" (click)="closeMobileMenu()">Upload</a>
    <a *ngIf="isFarmer" routerLink="/products/my" (click)="closeMobileMenu()">My Products</a>
    <a *ngIf="isAdmin" routerLink="/admin" (click)="closeMobileMenu()">Admin Panel</a>

    <a *ngIf="!isLoggedIn" routerLink="/login" (click)="closeMobileMenu()">Login</a>
    <a *ngIf="!isLoggedIn" routerLink="/register" (click)="closeMobileMenu()">Register</a>

    <button *ngIf="isLoggedIn"
            (click)="logout()"
            class="bg-red-600 text-white px-8 py-3 rounded-full text-lg">
      Logout
    </button>
  </div>
</nav>
